name: build
on:
  push:
    paths-ignore: ['**.md', 'LICENSE.*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_VERSION: 1.16.2
  # packer init downloads the qemu and ansible plugins from GitHub; avoids API rate limits
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: packer init . && packer fmt -check -diff . && packer validate .
      - run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils
      - run: |
          shellcheck tests/smoke.sh files/usr/local/sbin/{topgen-scrape.sh,topgen-ca.sh,topgen-boot,frr-shim}
          # legacy upstream style
          shellcheck -S error files/usr/local/sbin/topgen-{mkdns,vmail}.sh
          xmllint --noout files/etc/greybox/map.xml
          if grep -qP '\t' files/etc/greybox/map.xml; then echo "map.xml contains tabs"; exit 1; fi
          test "$(grep -c '@EXT_IFACE@' files/etc/greybox/map.xml)" -eq 1
          python3 -m py_compile files/usr/local/sbin/greybox-ctl files/usr/local/share/slatebox/core_services/slatebox_svcs/userdefined.py

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACKER_LOG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm is not writable; this runner has no usable KVM"; ls -l /dev/kvm; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso sshpass busybox dnsutils
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      # the runner image ships ansible-core (pipx); Packer's ansible provisioner runs it
      - run: ansible-playbook --version
      - name: Pick the build directory (the disk with most free space)
        run: |
          df -h
          if mountpoint -q /mnt && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            BUILD=/mnt/build
          else
            BUILD=$RUNNER_TEMP/build
          fi
          sudo mkdir -p "$BUILD/tmp" && sudo chown -R "$USER" "$BUILD"
          df -h "$BUILD"
          {
            echo "BUILD=$BUILD"
            echo "PACKER_LOG_PATH=$BUILD/packer.log"
            echo "PACKER_CACHE_DIR=$BUILD/cache"
            echo "TMPDIR=$BUILD/tmp"
          } >>"$GITHUB_ENV"
      - run: packer init . && packer build -color=false -timestamp-ui -var "output_dir=$BUILD/image" .
      - run: df -h "$BUILD" && ls -l "$BUILD/image"
      # --foreground: on timeout only smoke.sh gets SIGTERM, so qemu stays up for its diag()
      - run: timeout --foreground 40m tests/smoke.sh "$BUILD/image/slatebox.qcow2"
        timeout-minutes: 45
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: slatebox-qcow2
          path: ${{ env.BUILD }}/image/slatebox.qcow2
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          path: |
            ${{ env.BUILD }}/packer.log
            serial-*.log
            smoke-diag.txt
          retention-days: 7
