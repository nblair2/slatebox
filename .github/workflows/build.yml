name: build
# Pull requests and pushes are filtered to the default branch by the lint
# job's `if` (the same check as release.yml), so the branch name is not
# repeated here. workflow_dispatch builds any branch on demand.
on:
  push:
    paths-ignore: ['**.md', 'LICENSE.*']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE.*']
  workflow_dispatch:

# A new commit on a pull request cancels its older run; pushes to the
# default branch queue instead.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKER_VERSION: 1.16.2
  # packer init downloads the qemu and ansible plugins from GitHub; avoids API rate limits
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch ||
      github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: make init
      # prek.toml runs both Packer checks; the runner ships ansible-playbook.
      # latest-known: the newest prek whose checksum this action release bundles.
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: latest-known

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACKER_LOG: "1"
      PACKER_LOG_PATH: packer.log
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm is not writable; this runner has no usable KVM"; ls -l /dev/kvm; exit 1; }
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - uses: astral-sh/setup-uv@v7
      - run: make install-dev
      # cpus: as many as the runner has (the variable's default, 4, is more
      # than a 2-CPU runner's KVM recommends)
      - run: make build PACKER_ARGS="-color=false -timestamp-ui -var cpus=$(nproc)"
      # --deadline (minutes) stops the run with diagnostics before the step's
      # timeout would kill it.
      - run: make test TEST_ARGS="--deadline 50 --junitxml=test-output/junit.xml"
        timeout-minutes: 60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: slatebox-qcow2
          path: build/image/slatebox.qcow2
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          path: |
            packer.log
            serial-*.log
          retention-days: 7
