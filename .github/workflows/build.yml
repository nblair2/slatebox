name: build
on:
  push:
    paths-ignore: ['**.md', 'LICENSE.*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_VERSION: 1.16.2
  # packer init downloads the qemu and ansible plugins from GitHub; avoids API rate limits
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: packer init .
      # prek.toml runs both Packer checks; the runner ships ansible-playbook.
      # latest-known: the newest prek whose checksum this action release bundles.
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: latest-known

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACKER_LOG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm is not writable; this runner has no usable KVM"; ls -l /dev/kvm; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils xorriso sshpass busybox dnsutils
      # before the build, so a broken test setup fails fast
      - name: Install the test tools
        run: |
          sudo apt-get install -y libnss3-tools traceroute
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          .venv/bin/playwright install --with-deps --only-shell chromium
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      # the runner image ships ansible-core (pipx); Packer's ansible provisioner runs it
      - run: ansible-playbook --version
      - name: Pick the build directory (the disk with most free space)
        run: |
          df -h
          if mountpoint -q /mnt && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then
            BUILD=/mnt/build
          else
            BUILD=$RUNNER_TEMP/build
          fi
          sudo mkdir -p "$BUILD/tmp" && sudo chown -R "$USER" "$BUILD"
          df -h "$BUILD"
          {
            echo "BUILD=$BUILD"
            echo "PACKER_LOG_PATH=$BUILD/packer.log"
            echo "PACKER_CACHE_DIR=$BUILD/cache"
            echo "TMPDIR=$BUILD/tmp"
          } >>"$GITHUB_ENV"
      - run: packer init . && packer build -color=false -timestamp-ui -var "output_dir=$BUILD/image" .
      - run: df -h "$BUILD" && ls -l "$BUILD/image"
      # Boots the image and runs tests/test_*.py. --deadline (minutes) stops the
      # run with diagnostics before the step's timeout would kill it.
      - name: Test the image
        run: .venv/bin/python -m pytest tests --image "$BUILD/image/slatebox.qcow2" --deadline 50 --junitxml=test-output/junit.xml
        timeout-minutes: 60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: slatebox-qcow2
          path: ${{ env.BUILD }}/image/slatebox.qcow2
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          path: |
            ${{ env.BUILD }}/packer.log
            serial-*.log
          retention-days: 7
