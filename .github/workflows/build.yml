name: build
# Branches are filtered in the triggers
# workflow_dispatch builds any branch on demand
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE.*']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE.*']
  workflow_dispatch:

# A new commit on a pull request cancels an in progress run. pushes to main queue
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKER_VERSION: 1.16.2
  # avoid API rate limits
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: make init
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: latest-known

  build:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      PACKER_LOG: "1"
      PACKER_LOG_PATH: packer.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm is not writable; this runner has no usable KVM"; ls -l /dev/kvm; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make install-dev
      # cpus: as many as the runner has
      - run: make build PACKER_ARGS="-color=false -timestamp-ui -var cpus=$(nproc)"
      - run: make test TEST_ARGS="--deadline 50 --junitxml=test-output/junit.xml"
        timeout-minutes: 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-output
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: slatebox-qc2
          path: output/slatebox.qc2
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: |
            packer.log
            serial-*.log
          retention-days: 7
