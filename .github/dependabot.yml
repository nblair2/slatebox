# One grouped pull request per ecosystem
# Not covered (bump by hand):
# * ansible/
#   * CORE
#   * CORE's Python 3.12
#   * uv
#   * goscrape
# * .github/workflows/ci.yml
#   * PACKER_VERSION
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]
