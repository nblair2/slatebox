# Mail domains, one per line:
#   <server>.<domain> <ip_addr> <user1>:<pass1> <user2>:<pass2> ...
# These add to the build's mail_sites; a line for one of their domains replaces
# it. Give each domain an address of its own. Mail to unknown users lands in
# /var/lib/topgen/vmail/DFLT. Apply changes with
#   greybox-ctl exec topgen.info topgen-boot reload-mail
#
#mail.example.com 203.0.113.25 jdoe:tartans buyer:tartans
