# Mail domains with accounts, one per line:
#   <server>.<domain> <ip_addr> <user1>:<pass1> <user2>:<pass2> ...
# Every mirrored site also gets mail.<domain> at its web address, without
# accounts, unless a line here already uses that domain or address. Mail to
# unknown users lands in /var/lib/topgen/vmail/DFLT. Apply changes with
#   greybox-ctl exec topgen.info topgen-boot reload-mail
#
#mail.example.com 203.0.113.25 jdoe:tartans buyer:tartans
