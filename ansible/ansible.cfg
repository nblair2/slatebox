# Used by the Packer build (ANSIBLE_CONFIG in slatebox.pkr.hcl).
[defaults]
# The build is read from CI logs: task results as multi-line YAML, and the
# task file and line of a failing task.
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
show_task_path_on_failure = true
# Ubuntu 26.04's only Python; skips interpreter discovery and its warning.
interpreter_python = /usr/bin/python3
