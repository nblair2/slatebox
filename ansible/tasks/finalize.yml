---
- name: Create the documentation directory
  ansible.builtin.file:
    path: /usr/local/share/doc/slatebox
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install licenses and provenance
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: /usr/local/share/doc/slatebox/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - LICENSE
    - LICENSE.greybox
    - LICENSE.topgen
    - README.md

# Network: the first NIC (eth0) is left to greybox's RJ45 node. Every other NIC
# gets DHCP.
- name: Remove cloud-init's netplan configuration
  # it pins the build VM's NIC by MAC address, which differs on every VM
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent

- name: Install the network configuration
  ansible.builtin.copy:
    src: "{{ files_dir }}/etc/{{ item }}"
    dest: /etc/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - default/grub.d/60-slatebox.cfg
    - systemd/network/10-greybox-ext.network
    - systemd/network/20-slatebox.network

- name: Apply the kernel command line (update-grub)
  ansible.builtin.command: update-grub
  changed_when: true

# Image size
- name: Remove downloaded packages (apt-get clean)
  ansible.builtin.apt:
    clean: true

- name: Remove the scratch directory
  ansible.builtin.file:
    path: "{{ build_tmp.path }}"
    state: absent

# Last: the host and all CORE nodes resolve via 8.8.8.8 inside the simulation
# (greybox README). A regular file replaces the systemd-resolved stub link;
# systemd-resolved keeps running. The file stays: tmpfiles (L!) and
# systemd-resolved's package scripts link only a missing /etc/resolv.conf,
# and systemd-resolved itself writes only under /run (test_1_boot checks).
- name: Remove the systemd-resolved stub link /etc/resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: Resolve via the simulated 8.8.8.8
  ansible.builtin.copy:
    src: "{{ files_dir }}/etc/resolv.conf"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Read the host name
  ansible.builtin.command: hostname
  register: host_name
  changed_when: false

- name: Check whether /etc/hosts names the host
  ansible.builtin.command: grep -qw {{ host_name.stdout }} /etc/hosts
  register: hosts_has_name
  changed_when: false
  failed_when: hosts_has_name.rc > 1

- name: Add the host name to /etc/hosts
  # with resolv.conf pointing into the simulation, the host can only resolve
  # its own name from /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: 127.0.1.1 {{ host_name.stdout }}
  when: hosts_has_name.rc == 1

- name: Discard unused blocks, so the compressed image stays small
  ansible.builtin.command: fstrim -av
  changed_when: false
  failed_when: false
