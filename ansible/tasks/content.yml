---
- name: Create the TopGen CA
  ansible.builtin.command: topgen-ca.sh init
  changed_when: true

- name: Mirror the web sites and print the outcome
  block:
    - name: Mirror the web sites into topgen's vhosts {{ scrape_sites }}
      # Runs in the background and is polled every minute, so a long scrape
      # does not depend on one long-lived command; the async limit is only an
      # upper bound, scrape_timeout is the real one.
      ansible.builtin.command:
        argv: "{{ ['topgen-scrape.sh', scrape_depth | string, scrape_timeout] + scrape_sites }}"
      environment:
        TOPGEN_SCRAPE_JOBS: "{{ scrape_jobs }}"
        # the serial console, i.e. serial-build.log on the build host
        TOPGEN_SCRAPE_PROGRESS: /dev/console
      async: 604800
      poll: 60
      register: scrape
      changed_when: true

    - name: Show the scrape summary
      ansible.builtin.debug:
        var: scrape.stdout_lines

  rescue:
    - name: Read the end of the scrape log
      ansible.builtin.command: tail -n 100 /var/log/topgen-scrape.log
      register: scrape_log
      changed_when: false
      failed_when: false

    - name: Show the end of the scrape log
      ansible.builtin.debug:
        var: scrape_log.stdout_lines

    - name: Stop after the failed scrape
      ansible.builtin.fail:
        msg: topgen-scrape.sh failed; its output and the log tail are above

- name: Generate topgen's mail configuration
  ansible.builtin.command: topgen-vmail.sh -f
  changed_when: true

- name: Generate topgen's DNS configuration
  # the same command the topgen.info node runs at every start; it reads
  # hosts.nginx, hosts.vmail and backbone.hosts, so it comes after them
  ansible.builtin.command: topgen-boot dns
  changed_when: true

- name: Publish the TopGen CA's CRL
  ansible.builtin.command: topgen-ca.sh gencrl
  changed_when: true
