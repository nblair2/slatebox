# Lint and hygiene hooks, run with prek (https://github.com/j178/prek):
#   prek install            # run the hooks on every commit
#   prek run --all-files    # what CI runs (.github/workflows/build.yml)
# The local packer hook needs packer on PATH. Dependabot bumps the revs.

# Upstream license texts stay verbatim.
exclude: ^LICENSE\.

repos:
  # prek's built-in Rust implementations: no clone, no environment.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # TEMPORARY: upstream-derived script with 2 trailing-whitespace lines
        # (one in its usage text); drop once the file is cleaned up.
        exclude: ^files/usr/local/sbin/topgen-mkdns\.sh$
      - id: end-of-file-fixer
        # TEMPORARY: same file ends with a blank line.
        exclude: ^files/usr/local/sbin/topgen-mkdns\.sh$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # files/etc/greybox/map.xml is ~185 KiB; --enforce-all also checks
        # files already in the repo (CI runs on all files, not on additions).
        args: [--maxkb=256, --enforce-all]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      # The greybox map: greybox-ctl substitutes the RJ45 node's interface for
      # its one @EXT_IFACE@ at start time, and the map is space-indented.
      - id: require-pattern
        name: map.xml has an @EXT_IFACE@ placeholder
        args: ['@EXT_IFACE@']
        files: ^files/etc/greybox/map\.xml$
      - id: deny-pattern
        name: map.xml has only one @EXT_IFACE@ placeholder
        args: [--multiline, '@EXT_IFACE@.*@EXT_IFACE@']
        files: ^files/etc/greybox/map\.xml$
      - id: deny-pattern
        name: map.xml has no tabs
        args: ['\t']
        files: ^files/etc/greybox/map\.xml$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (slatebox scripts)
        exclude: ^files/usr/local/sbin/topgen-(mkdns|vmail)\.sh$
      # Upstream topgen scripts keep their legacy style (unquoted expansions,
      # `[ -a ]`, ...); only errors are checked there.
      - id: shellcheck
        name: shellcheck -S error (upstream topgen-mkdns.sh, topgen-vmail.sh)
        args: [--severity=error]
        files: ^files/usr/local/sbin/topgen-(mkdns|vmail)\.sh$

  # Python: tests/, greybox-ctl (detected by its shebang) and the CORE
  # service. Settings in ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
        types_or: [python]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        args: [--offline, --profile=production, ansible/]
        files: ^ansible/
        always_run: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: packer-fmt
        name: packer fmt -check
        language: system
        entry: packer fmt -check -diff .
        files: \.pkr\.hcl$
        pass_filenames: false
